# Local Mongo for the protocol tests that need Node's side (lease, publish):
# a single-node replica set, because multi-document transactions need one.
# S3 needs no container — integration tests run an in-process moto server (tests/integration).
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27018:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate().ok }"]
      interval: 5s
      retries: 10
