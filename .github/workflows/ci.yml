name: CI

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # Single-node replica set for the protocol tests that need Node's side (lease, publish).
      - name: Mongo replica set
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: "7.0"
          mongodb-replica-set: rs0
          mongodb-port: 27018

      - name: Install
        run: uv sync --locked

      # The reader never downloads extensions during a read; the image (and CI) install them.
      - name: DuckDB extensions
        run: uv run python -m scripts.install_duckdb_extensions

      - name: Ruff
        run: uv run ruff check src tests probes scripts prototype && uv run ruff format --check src tests probes scripts prototype

      - name: Mypy (gate) + ty
        run: uv run mypy src tests probes scripts prototype && uv run ty check src tests probes scripts prototype

      - name: Layers
        run: uv run lint-imports

      - name: Pytest
        env:
          REQUIRE_MONGO: "1"
        run: uv run pytest

      # The library facts consistency.md relies on — fails loudly if an upgrade changes them.
      - name: Delta / DuckDB probe
        run: uv run python probes/delta_api_probe.py
