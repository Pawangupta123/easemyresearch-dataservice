[project]
name = "easemyresearch-dataservice"
version = "0.1.0"
description = "Stores and computes over large research datasets (Delta Lake on S3) for EaseMyResearch"
authors = [{ name = "Pawan gupta", email = "guppwn@gmail.com" }]
requires-python = ">=3.12"
# Minimum versions are the ones the Phase 0 probe (probes/delta_api_probe.py) verified:
# txn app transactions + transaction_version, custom commit metadata in history,
# restore(commit_properties), vacuum(keep_versions), and a same-app-id race rejected.
dependencies = [
    "deltalake>=1.6.6",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "granian>=2.8.5",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.1",
    "pymongo>=4.19.0",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dataservice"

[dependency-groups]
dev = [
    "boto3>=1.43.118",
    "httpx2>=2.16.0",
    "import-linter>=2.15",
    "moto[server]>=5.2.4",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "infra: needs docker compose services (Mongo replica set)",
]

[tool.importlinter]
root_package = "dataservice"

# Like Node: higher layers import lower ones, never the reverse.
[[tool.importlinter.contracts]]
name = "Layers: main -> modules -> storage -> common -> config"
type = "layers"
layers = [
    "dataservice.main",
    "dataservice.modules",
    "dataservice.storage",
    "dataservice.common",
    "dataservice.config",
]

# Node's rule: no module imports another module (no service -> service across modules).
[[tool.importlinter.contracts]]
name = "Modules are independent"
type = "independence"
modules = ["dataservice.modules.*"]
